services:
  data-service:
    container_name: tw-stock-quant-data-service
    image: tw-stock-quant:latest
    build: .
    init: true
    restart: unless-stopped
    working_dir: /app
    command: ["uvicorn", "backend.data_service.main:app", "--host", "0.0.0.0", "--port", "8001"]
    volumes:
      - stock-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    container_name: tw-stock-quant-frontend
    image: tw-stock-quant:latest
    build: .
    init: true
    restart: unless-stopped
    environment:
      DATA_SERVICE_URL: http://data-service:8001
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    depends_on:
      data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  stock-data:
